[package]
name = "ferrumc-world"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Strongly-typed coordinates: LocalBlockPos indexes a chunk section's blocks.
ferrumc-math = { workspace = true }
# Block-state id constants (air) and the pinned flat-world block lookup.
ferrumc-registry = { workspace = true }
# ItemStack: the contents of a chest block-entity's container. ferrumc-items
# depends only on codec/nbt/registry, so this edge is acyclic (it never reaches
# back to world) and keeps container contents modelled as the canonical item type.
ferrumc-items = { workspace = true }
# Original Xoroshiro positional names use MD5-128, already pinned in the workspace lock.
md5 = { package = "md-5", version = "0.10" }
# BiomeManager's seed obfuscation hashes eight little-endian bytes with SHA-256.
# Version is already pinned in the workspace lock; this producer uses no I/O.
sha2 = "=0.10.9"
# Bounded builtin JSON string/escape decoding and structural oracle JSON.
# Number tokens are retained by World's own checked lexer and independently
# decoded as original FLOAT/DOUBLE/INT. No runtime I/O or sampling API is added.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Classifying error variants for bit-packing / indexing failures.
thiserror = { workspace = true }

[dev-dependencies]
# Exercise lossless named/custom NBT chest components without adding NBT work
# or protocol encoding to the pure world production lane.
ferrumc-nbt = { workspace = true }

[lints]
workspace = true
